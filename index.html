<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVP.OS | Titan Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .module-card { background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .module-card:hover { transform: translateY(-10px); border-color: rgba(99, 102, 241, 0.4); background: rgba(30, 41, 59, 0.6); }
    </style>
</head>
<body class="p-6">
    <div class="max-w-6xl w-full">
        <header class="text-center mb-16">
            <h1 class="text-6xl font-[900] tracking-tighter mb-4">GVP<span class="text-indigo-500">.OS</span></h1>
            <p id="user-mantra" class="text-slate-400 font-medium tracking-widest uppercase text-[10px]">Arquitetura de Gestão Pessoal</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <a href="tarefas.html" class="module-card p-10 rounded-[50px]">
                <div class="text-5xl mb-6">🎯</div>
                <h2 class="text-2xl font-black mb-2">Timeline</h2>
                <p class="text-slate-400 text-sm">Gestão de projetos e metas.</p>
            </a>

            <a href="financeiro.html" class="module-card p-10 rounded-[50px]">
                <div class="text-5xl mb-6">💰</div>
                <h2 class="text-2xl font-black mb-2">Finanças</h2>
                <p class="text-slate-400 text-sm">Controle de fluxo e contas.</p>
            </a>

            <a href="notas.html" class="module-card p-10 rounded-[50px]">
                <div class="text-5xl mb-6">🧠</div>
                <h2 class="text-2xl font-black mb-2">Memória</h2>
                <p class="text-slate-400 text-sm">Cérebro digital e anotações.</p>
            </a>

            <div class="module-card p-10 rounded-[50px] border-indigo-500/20 bg-indigo-950/10">
                <div class="text-5xl mb-6">☁️</div>
                <h2 class="text-2xl font-black mb-2">Titan Cloud</h2>
                <div class="flex gap-2 mt-4">
                    <button onclick="TitanSync.upload()" class="flex-1 py-3 bg-emerald-600 rounded-2xl font-black text-[10px] uppercase">Subir</button>
                    <button onclick="TitanSync.download()" class="flex-1 py-3 bg-indigo-600 rounded-2xl font-black text-[10px] uppercase">Baixar</button>
                </div>
            </div>

            <a href="config.html" class="module-card p-10 rounded-[50px]">
                <div class="text-5xl mb-6">⚙️</div>
                <h2 class="text-2xl font-black mb-2">Ajustes</h2>
                <p class="text-slate-400 text-sm">Configurações e Nuvem.</p>
            </a>
        </div>
    </div>

    <script src="sync.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const profile = JSON.parse(localStorage.getItem('gtitan_profile')) || {};
            if(profile.mantra) document.getElementById('user-mantra').innerText = profile.mantra;
        });
    </script>
</body>
</html>
