<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVP.OS | Configurações</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; }
        .config-card { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.05); border-radius: 40px; }
        input { background: rgba(15, 23, 42, 0.8) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; width: 100%; padding: 1rem; border-radius: 1rem; outline: none; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <a href="index.html" class="text-indigo-400 font-black text-[10px] uppercase tracking-widest mb-8 block">← Voltar</a>
        <h1 class="text-4xl font-black mb-12">CONFIGURAÇÕES</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <section class="config-card p-10 space-y-6">
                <h2 class="text-indigo-400 font-black text-xs uppercase tracking-widest">Nuvem GitHub</h2>
                <div class="space-y-4">
                    <input type="text" id="sync-user" placeholder="Seu usuário GitHub">
                    <input type="text" id="sync-repo" placeholder="Nome do repositório (ex: gvp-data)">
                    <input type="password" id="sync-token" placeholder="Cole seu Token (ghp_...) aqui">
                    <button onclick="saveSync()" class="w-full py-4 bg-indigo-600 rounded-2xl font-black uppercase text-[10px]">Salvar Configurações</button>
                </div>
            </section>

            <section class="config-card p-10 space-y-6">
                <h2 class="text-indigo-400 font-black text-xs uppercase tracking-widest">Perfil</h2>
                <div class="space-y-4">
                    <input type="text" id="conf-name" placeholder="Seu Nome">
                    <input type="text" id="conf-mantra" placeholder="Seu Mantra">
                    <button onclick="saveProfile()" class="w-full py-4 bg-slate-700 rounded-2xl font-black uppercase text-[10px]">Salvar Perfil</button>
                </div>
            </section>
        </div>
    </div>

    <script src="sync.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cfg = TitanSync.getConfig();
            if(cfg) {
                document.getElementById('sync-user').value = cfg.user || "";
                document.getElementById('sync-repo').value = cfg.repo || "";
                document.getElementById('sync-token').value = cfg.token || "";
            }
            const profile = JSON.parse(localStorage.getItem('gtitan_profile')) || {};
            document.getElementById('conf-name').value = profile.name || "";
            document.getElementById('conf-mantra').value = profile.mantra || "";
        });

        function saveSync() {
            TitanSync.saveConfig(
                document.getElementById('sync-user').value,
                document.getElementById('sync-repo').value,
                document.getElementById('sync-token').value
            );
        }

        function saveProfile() {
            const profile = {
                name: document.getElementById('conf-name').value,
                mantra: document.getElementById('conf-mantra').value
            };
            localStorage.setItem('gtitan_profile', JSON.stringify(profile));
            alert("Perfil salvo!");
        }
    </script>
</body>
</html>
